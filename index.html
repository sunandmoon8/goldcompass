.overlay{
  min-height:100vh;
  background:rgba(255,248,225,0.55);
  padding:1.75rem 1rem 4rem;
}
.app{max-width:420px;margin:0 auto;}

h1{
  text-align:center;
  font-size:43.2px;
  font-weight:400;
  letter-spacing:.02em;
  color:#3a2200;
  text-shadow:0 1px 3px rgba(255,220,130,0.5);
  margin-bottom:4px;
  font-family:Georgia,'Times New Roman','Hiragino Mincho ProN','Yu Mincho',serif;
}
.dateline{
  text-align:center;
  font-size:19.2px;
  font-weight:400;
  color:#3a2200;
  letter-spacing:.12em;
  text-shadow:0 1px 2px rgba(255,220,130,0.4);
  margin-bottom:1.25rem;
  font-family:Georgia,'Times New Roman','Hiragino Mincho ProN','Yu Mincho',serif;
}

.card{
  background:rgba(255,255,250,0.88);
  border:1px solid rgba(200,160,40,0.3);
  border-radius:14px;
  padding:1.1rem;
  margin-bottom:.9rem;
  width:100%;
}
.card-title{
  font-size:13.2px;
  color:rgba(100,60,5,1.0);
  letter-spacing:.18em;
  margin-bottom:.75rem;
}

/* 月サイン */
.moon-row{text-align:center;}
.moon-info{}
.moon-sign-text{
  font-size:26.4px;
  font-weight:400;
  font-family:Georgia,serif;
  color:#3a2200;
  line-height:1.2;
  text-align:center;
}
.moon-deg-text{font-size:13.2px;color:rgba(110,70,10,0.75);margin-top:2px;}
.moon-phase-badge{
  display:inline-block;
  font-size:12.0px;
  background:rgba(200,150,20,0.15);
  border:1px solid rgba(180,130,10,0.35);
  border-radius:20px;
  padding:2px 9px;
  color:rgba(110,70,10,0.85);
  margin-top:4px;
}
.moon-desc-text{
  font-size:15.6px;
  color:rgba(60,34,0,0.85);
  line-height:1.75;
  margin-top:.6rem;
  text-align:center;
  font-weight:300;
  font-family:Georgia,'Hiragino Mincho ProN','Yu Mincho',serif;
}
.danger-badge{
  display:inline-flex;align-items:center;gap:4px;
  font-size:13.2px;
  background:rgba(200,50,50,0.12);
  border:1px solid rgba(200,80,80,0.35);
  border-radius:6px;
  padding:3px 8px;
  color:rgba(160,40,40,0.9);
  margin-top:.5rem;
}

/* タスク */
.task-input-row{display:flex;gap:8px;margin-bottom:.75rem;}
.task-input{
  flex:1;
  padding:9px 11px;
  background:rgba(255,255,250,0.85);
  border:1px solid rgba(180,140,30,0.3);
  border-radius:9px;
  font-size:16.8px;
  color:#3a2200;
  font-family:inherit;
  outline:none;
  -webkit-appearance:none;
}
.task-input::placeholder{color:rgba(140,100,20,0.45);}
.task-input:focus{border-color:rgba(180,140,30,0.6);background:rgba(255,250,210,0.75);}
.add-btn{
  padding:9px 14px;
  background:rgba(200,150,20,0.2);
  border:1px solid rgba(200,150,20,0.4);
  border-radius:9px;
  color:#5a3a00;
  font-size:21.6px;
  cursor:pointer;
  flex-shrink:0;
  -webkit-tap-highlight-color:transparent;
}
.add-btn:active{background:rgba(200,150,20,0.38);}
.task-list{display:flex;flex-direction:column;gap:6px;}
.task-item{
  display:flex;align-items:center;gap:10px;
  background:rgba(255,250,220,0.5);
  border:1px solid rgba(180,140,30,0.2);
  border-radius:9px;
  padding:9px 10px;
}
.task-item.done{opacity:0.5;}
.task-item.carried{border-color:rgba(200,120,20,0.35);}
.task-check{
  width:22px;height:22px;
  border-radius:50%;
  border:1.5px solid rgba(160,110,10,0.5);
  background:transparent;
  cursor:pointer;
  flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-size:15.6px;
  color:#5a3a00;
  -webkit-tap-highlight-color:transparent;
}
.task-check.checked{
  background:rgba(200,150,20,0.3);
  border-color:rgba(160,110,10,0.7);
}
.task-text{
  flex:1;
  font-size:16.8px;
  color:#3a2200;
  line-height:1.4;
}
.task-item.done .task-text{text-decoration:line-through;color:rgba(60,34,0,0.4);}
.carried-label{
  font-size:12.0px;
  color:rgba(160,90,10,0.8);
  display:block;
  margin-top:2px;
}
.task-edit-input{
  flex:1;
  padding:4px 8px;
  background:rgba(255,255,250,0.9);
  border:1px solid rgba(180,140,30,0.5);
  border-radius:6px;
  font-size:16.8px;
  color:#3a2200;
  font-family:inherit;
  outline:none;
}
.task-del{
  background:transparent;
  border:none;
  color:rgba(160,100,20,0.45);
  font-size:19.2px;
  cursor:pointer;
  padding:2px 4px;
  -webkit-tap-highlight-color:transparent;
}
.task-del:active{color:rgba(180,60,40,0.8);}
.no-tasks{font-size:15.6px;color:rgba(130,90,10,0.5);text-align:center;padding:.5rem 0;}

/* 今日の気分 */
.field{margin-bottom:0;}
.field label{
  font-size:12.0px;
  color:rgba(130,90,10,0.7);
  display:block;
  margin-bottom:4px;
  letter-spacing:.08em;
}
.field input{
  width:100%;
  padding:9px 11px;
  background:rgba(255,255,250,0.85);
  border:1px solid rgba(180,140,30,0.25);
  border-radius:9px;
  font-size:16.8px;
  color:#3a2200;
  font-family:inherit;
  outline:none;
  -webkit-appearance:none;
}
.field input::placeholder{color:rgba(140,100,20,0.4);}
.field input:focus{border-color:rgba(180,140,30,0.55);background:rgba(255,250,210,0.75);}

/* ボタン */
.btn-primary{
  width:100%;
  padding:13px;
  background:rgba(200,150,20,0.22);
  border:1px solid rgba(200,150,20,0.45);
  border-radius:11px;
  color:#5a3a00;
  font-size:18.0px;
  font-family:inherit;
  letter-spacing:.08em;
  cursor:pointer;
  margin-bottom:.5rem;
  -webkit-tap-highlight-color:transparent;
}
.btn-primary:active{background:rgba(200,150,20,0.38);}
.btn-sub{
  width:100%;
  padding:9px;
  background:transparent;
  border:none;
  color:rgba(100,65,10,0.75);
  font-size:15.6px;
  font-family:inherit;
  cursor:pointer;
  margin-bottom:.5rem;
  -webkit-tap-highlight-color:transparent;
}
.savedmsg{text-align:center;font-size:15.6px;min-height:18px;color:rgba(60,120,20,0.9);margin-bottom:.4rem;}
.note{text-align:center;font-size:12.0px;color:rgba(120,85,10,0.45);margin-bottom:1rem;}

/* 過去の記録 */
.view-tabs{display:flex;gap:6px;margin-bottom:.75rem;}
.view-tab{
  flex:1;padding:7px;
  background:rgba(255,250,220,0.45);
  border:1px solid rgba(180,140,30,0.25);
  border-radius:8px;
  color:rgba(110,70,10,0.65);
  font-size:14.4px;
  cursor:pointer;
  text-align:center;
  font-family:inherit;
  -webkit-tap-highlight-color:transparent;
}
.view-tab.active{
  background:rgba(200,150,20,0.22);
  border-color:rgba(180,130,10,0.45);
  color:#5a3a00;
}
.hist-item{
  background:rgba(255,255,250,0.85);
  border:1px solid rgba(180,140,30,0.2);
  border-radius:10px;
  padding:.8rem 1rem;
  margin-bottom:7px;
}
.hist-date{font-size:13.2px;color:rgba(120,80,10,0.7);margin-bottom:4px;}
.hist-moon{font-size:13.2px;color:rgba(110,70,10,0.65);margin-bottom:5px;}
.hist-task{font-size:14.4px;color:rgba(60,34,0,0.8);line-height:1.6;}
.hist-task.done-task{color:rgba(100,70,10,0.5);text-decoration:line-through;}
.hist-mood{font-size:14.4px;color:rgba(80,50,10,0.7);margin-top:4px;}
.empty-hist{text-align:center;font-size:15.6px;color:rgba(130,90,10,0.45);padding:1.5rem 0;}
#moon-svg{display:block;}
/* カレンダー */
.calendar{
  background:rgba(255,255,250,0.88);
  border:1px solid rgba(200,160,40,0.3);
  border-radius:14px;
  padding:1.1rem;
  margin-top:1.8rem;
  margin-bottom:.9rem;
  max-width:420px;
  width:100%;
  margin-left:auto;
  margin-right:auto;
}
.cal-header{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:.75rem;
}
.cal-title{
  font-size:16.8px;
  color:#3a2200;
  font-family:Georgia,'Hiragino Mincho ProN','Yu Mincho',serif;
  letter-spacing:.08em;
}
.cal-nav{
  background:transparent;
  border:none;
  color:rgba(100,65,10,0.7);
  font-size:21.6px;
  cursor:pointer;
  padding:2px 8px;
  -webkit-tap-highlight-color:transparent;
}
.cal-grid{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:4px;
}
.cal-dow{
  text-align:center;
  font-size:12.0px;
  color:rgba(130,90,10,0.6);
  padding:2px 0;
}
.cal-day{
  text-align:center;
  font-size:15.6px;
  color:rgba(60,34,0,0.75);
  padding:6px 2px;
  border-radius:50%;
  cursor:pointer;
  position:relative;
  -webkit-tap-highlight-color:transparent;
  min-height:32px;
  display:flex;align-items:center;justify-content:center;
}
.cal-day.empty{cursor:default;}
.cal-day.today{
  background:rgba(200,150,20,0.25);
  color:#3a2200;
  font-weight:500;
}
.cal-day.has-record{
  background:rgba(200,150,20,0.35);
  color:#3a2200;
  font-weight:500;
  box-shadow:0 0 0 1.5px rgba(180,130,10,0.5);
}
.cal-day.has-record:hover{
  background:rgba(200,150,20,0.55);
}

/* 過去カード（ポップアップ風） */
.past-card{
  background:rgba(255,255,252,0.95);
  border:1px solid rgba(200,160,40,0.4);
  border-radius:14px;
  padding:1.1rem;
  margin-bottom:.9rem;
  display:none;
}
.past-card.show{display:block;}
.past-card-date{
  font-size:14.4px;
  color:rgba(130,90,10,0.7);
  margin-bottom:.5rem;
  font-family:Georgia,'Hiragino Mincho ProN',serif;
}
.past-card-moon{
  font-size:15.6px;
  color:rgba(100,65,10,0.8);
  margin-bottom:.6rem;
  text-align:center;
}
.past-card-close{
  float:right;
  background:transparent;
  border:none;
  color:rgba(130,90,10,0.5);
  font-size:21.6px;
  cursor:pointer;
  margin-top:-4px;
}
.past-task{
  font-size:15.6px;
  color:rgba(60,34,0,0.8);
  line-height:1.7;
}
.past-task.done{
  text-decoration:line-through;
  color:rgba(100,70,10,0.45);
}

.moon-bg-wrap{
  display:flex;justify-content:center;
  margin:-1.1rem -1.1rem .25rem;
  overflow:hidden;
  border-radius:14px 14px 0 0;
  opacity:0.45;
  pointer-events:none;
}
</style>
</head>
<body>
<div class="overlay">
<div class="app">

  <h1>Golden Compass</h1>
  <p class="dateline" id="dl"></p>

  <!-- 月サイン -->
  <div class="card">
    <div class="moon-bg-wrap"><svg id="moon-bg" width="200" height="200" viewBox="0 0 54 54"></svg></div>
    <div class="moon-row">
      <div class="moon-info">
        <div class="moon-sign-text" id="mn">—</div>
        <div class="moon-deg-text" id="md"></div>
        <span class="moon-phase-badge" id="mpn"></span>
      </div>
    </div>
    <p class="moon-desc-text" id="mt"></p>
    <div id="danger-area"></div>
  </div>

    <p class="card-title" style="margin-top:1rem;font-size:20.4px;font-weight:300;letter-spacing:.02em;font-family:'Hiragino Kaku Gothic ProN','Hiragino Sans',sans-serif;">今日のミッション</p>
    <div class="task-input-row">
      <input type="text" class="task-input" id="task-input" placeholder="" onkeydown="if(event.key==='Enter'&&!event.isComposing)addTask()"/>
      <button class="add-btn" onclick="addTask()">＋</button>
    </div>
    <div class="task-list" id="task-list"></div>
  </div>

  <!-- 過去カード -->
  <div class="past-card" id="past-card">
    <button class="past-card-close" onclick="closePastCard()">×</button>
    <p class="past-card-date" id="past-card-date"></p>
    <p class="past-card-moon" id="past-card-moon"></p>
    <div id="past-card-tasks"></div>
  </div>

  <!-- カレンダー -->
  <div class="calendar">
    <div class="cal-header">
      <button class="cal-nav" onclick="calPrev()">‹</button>
      <p class="cal-title" id="cal-title"></p>
      <button class="cal-nav" onclick="calNext()">›</button>
    </div>
    <div class="cal-grid" id="cal-grid"></div>
  </div>

    <div id="hl"></div>
  </div>

</div>
</div>

<script>
const KEY='compass_v1';
const KEY_TASKS='compass_tasks';
const WD=['日','月','火','水','木','金','土'];
const SG=[
  {n:'牡羊座',e:'Aries',d:'エネルギーが高まりやすい日。新しいことを始めるのに向いています。'},
  {n:'牡牛座',e:'Taurus',d:'五感が研ぎ澄まされる日。丁寧な食事や自然の中で過ごすと◎。'},
  {n:'双子座',e:'Gemini',d:'言葉やコミュニケーションが活発になる日。アイデアが湧きやすい。'},
  {n:'蟹座',e:'Cancer',d:'感情が豊かになりやすい日。家や身近な人との時間を大切に。'},
  {n:'獅子座',e:'Leo',d:'表現欲が高まる日。自分を楽しませることを優先して。'},
  {n:'乙女座',e:'Virgo',d:'細部への注意力が上がる日。整理や分析仕事に向いています。'},
  {n:'天秤座',e:'Libra',d:'バランス感覚が冴える日。人との対話や美しいものに触れる時間を。'},
  {n:'蠍座',e:'Scorpio',d:'感情が深まりやすい日。内省や対話に向いています。'},
  {n:'射手座',e:'Sagittarius',d:'視野が広がる日。遠くのこと、大きなことを考えたくなる。'},
  {n:'山羊座',e:'Capricorn',d:'地に足がつく日。計画を立てたり、着実な作業に向いています。'},
  {n:'水瓶座',e:'Aquarius',d:'独創的なアイデアが出やすい日。自分だけの視点を大切に。'},
  {n:'魚座',e:'Pisces',d:'感受性が敏感になる日。無理せずゆったりと過ごして。'},
];
// 国立天文台データ: 2026年3月19日10:23 新月を基準
const NAOJ_NEW_MOON = new Date('2026-03-19T10:23:00Z').getTime();
const SYN = 29.53059; // 朔望月（日）

function getMoonAge(dt){
  const elapsed=(dt.getTime()-NAOJ_NEW_MOON)/86400000;
  const age=((elapsed%SYN)+SYN)%SYN;
  return age;
}

function getPhaseName(age){
  if(age < 1.0)  return '新月';
  if(age < 3.5)  return '三日月';
  if(age < 6.5)  return '上弦前';
  if(age < 8.5)  return '上弦';
  if(age < 11.5) return '十日夜';
  if(age < 13.5) return '十三夜';
  if(age < 16.0) return '満月';
  if(age < 18.5) return '十六夜';
  if(age < 21.5) return '下弦前';
  if(age < 23.5) return '下弦';
  if(age < 26.5) return '有明月';
  if(age < 29.0) return '晦月';
  return '新月';
}

const PH=['新月','三日月','上弦前','上弦','十日夜','十三夜','満月','十六夜','下弦前','下弦','有明月','晦月'];
const DANGER=['新月','満月'];
let todayMoon={};

function dateKey(dt){
  return`${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
}
function today(){return dateKey(new Date());}

function r2(d){return d*Math.PI/180;}
function nm(d){return((d%360)+360)%360;}
function calcMoon(dt){
  const d=dt.getTime()/86400000-10957.5;
  const L=nm(218.316+13.176396*d),M=nm(134.963+13.064993*d);
  const F=nm(93.272+13.229350*d),Ms=nm(357.529+0.985600*d),D=nm(297.850+12.190749*d);
  const dL=6.289*Math.sin(r2(M))-1.274*Math.sin(r2(2*D-M))
    +0.658*Math.sin(r2(2*D))+0.214*Math.sin(r2(2*M))
    -0.186*Math.sin(r2(Ms))-0.114*Math.sin(r2(2*F));
  const REF=new Date('2025-01-29T12:36:00Z').getTime(),SYN=29.53059*86400000;
  return{lon:nm(L+dL),phase:((dt.getTime()-REF)%SYN+SYN)%SYN/SYN};
}

function moonSVG(r,cx,cy,phase){
  if(phase<0.03||phase>0.97){
    return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="rgba(160,110,10,0.6)" stroke-width="1.5"/>`;
  }
  if(phase>0.47&&phase<0.53){
    return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="rgba(200,150,20,0.4)" stroke="rgba(160,110,10,0.5)" stroke-width="1"/>`;
  }
  const isWax=phase<0.5;
  const ill=isWax?(phase*2):(1-(phase-0.5)*2);
  const ex=Math.abs(r*(1-ill*2));
  const shadow=isWax
    ?`<ellipse cx="${cx}" cy="${cy}" rx="${ex}" ry="${r}" fill="rgba(245,237,210,0.9)"/>
      <path d="M ${cx} ${cy-r} A ${r} ${r} 0 0 0 ${cx} ${cy+r}" fill="rgba(245,237,210,0.9)"/>`
    :`<ellipse cx="${cx}" cy="${cy}" rx="${ex}" ry="${r}" fill="rgba(245,237,210,0.9)"/>
      <path d="M ${cx} ${cy-r} A ${r} ${r} 0 0 1 ${cx} ${cy+r}" fill="rgba(245,237,210,0.9)"/>`;
  return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="rgba(200,150,20,0.4)" stroke="rgba(160,110,10,0.4)" stroke-width="1"/>${shadow}`;
}

function drawMoon(phase){
  const svg=document.getElementById('moon-svg');
  const bg=document.getElementById('moon-bg');
  if(bg)  bg.innerHTML=moonSVG(24,27,27,phase);
}

function loadTasks(){try{return JSON.parse(localStorage.getItem(KEY_TASKS)||'[]');}catch(e){return[];}}
function saveTasks(t){localStorage.setItem(KEY_TASKS,JSON.stringify(t));}

function addTask(){
  const input=document.getElementById('task-input');
  const text=input.value.trim();
  if(!text)return;
  const tasks=loadTasks();
  tasks.push({id:Date.now(),text,done:false,createdDate:today()});
  saveTasks(tasks);
  input.value='';
  input.blur();
  renderTasks();
  doSave();
  renderCalendar();
}

function toggleTask(id){
  const tasks=loadTasks();
  const t=tasks.find(t=>t.id===id);
  if(t){t.done=!t.done;if(t.done)t.doneDate=today();}
  saveTasks(tasks);renderTasks();
  renderCalendar();
}

function deleteTask(id){
  saveTasks(loadTasks().filter(t=>t.id!==id));renderTasks();
  renderCalendar();
}

function renderTasks(){
  const tasks=loadTasks();
  const list=document.getElementById('task-list');
  const td=today();
  if(!tasks.length){list.innerHTML='';return;}
  list.innerHTML=tasks.map(t=>{
    const carried=t.createdDate!==td&&!t.done;
    const carried_label=carried?'<span class="carried-label">📌 持ち越し（'+t.createdDate+'）</span>':'';
    return'<div class="task-item'+(t.done?' done':'')+(carried?' carried':'')+'">'
      +'<button class="task-check'+(t.done?' checked':'')+'" onclick="toggleTask('+t.id+')">'+(t.done?'✓':'')+'</button>'
      +'<div class="task-text">'+t.text+carried_label+'</div>'
      +'<button class="task-del" onclick="deleteTask('+t.id+')">×</button>'
      +'</div>';
  }).join('');
}

function loadRec(){try{return JSON.parse(localStorage.getItem(KEY)||'{}');}catch(e){return{};}}

function doSave(){
  const rec=loadRec(),dk=today();
  const tasks=loadTasks();
  rec[dk]={
    tasks:tasks.map(t=>({text:t.text,done:t.done,carried:t.createdDate!==dk})),
    ...todayMoon
  };
  localStorage.setItem(KEY,JSON.stringify(rec));
  renderCalendar();
}

// カレンダー
let calYear=new Date().getFullYear();
let calMonth=new Date().getMonth();

function renderCalendar(){
  const rec=loadRec();
  const title=document.getElementById('cal-title');
  title.textContent=`${calYear}年${calMonth+1}月`;
  const grid=document.getElementById('cal-grid');
  grid.innerHTML='';
  const dows=['日','月','火','水','木','金','土'];
  dows.forEach(d=>{
    const el=document.createElement('div');
    el.className='cal-dow';
    el.textContent=d;
    grid.appendChild(el);
  });
  const first=new Date(calYear,calMonth,1).getDay();
  const days=new Date(calYear,calMonth+1,0).getDate();
  const todayStr=today();
  for(let i=0;i<first;i++){
    const el=document.createElement('div');
    el.className='cal-day empty';
    grid.appendChild(el);
  }
  for(let d=1;d<=days;d++){
    const dk=`${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const el=document.createElement('div');
    el.className='cal-day';
    el.textContent=d;
    if(dk===todayStr) el.classList.add('today');
    if(rec[dk]) el.classList.add('has-record');
    if(rec[dk]){
      el.onclick=()=>showPastCard(dk);
    }
    grid.appendChild(el);
  }
}

function calPrev(){
  calMonth--;
  if(calMonth<0){calMonth=11;calYear--;}
  renderCalendar();
}
function calNext(){
  calMonth++;
  if(calMonth>11){calMonth=0;calYear++;}
  renderCalendar();
}

function showPastCard(dk){
  const rec=loadRec();
  const r=rec[dk];
  if(!r)return;
  const [y,mo,d]=dk.split('-');
  const dt=new Date(+y,+mo-1,+d);
  document.getElementById('past-card-date').textContent=`${y}年${+mo}月${+d}日（${WD[dt.getDay()]}）`;
  const moon=r.sign?`${r.sign}  ${r.deg}°  ${r.phase}`:'';
  document.getElementById('past-card-moon').textContent=moon;
  const tasks=(r.tasks||[]).map(t=>
    `<div class="past-task${t.done?' done':''}">${t.done?'✓':'○'} ${t.text}</div>`
  ).join('');
  document.getElementById('past-card-tasks').innerHTML=tasks||'<p style="font-size:15.6px;color:rgba(130,90,10,0.5);">記録なし</p>';
  document.getElementById('past-card').classList.add('show');
  document.getElementById('past-card').scrollIntoView({behavior:'smooth',block:'nearest'});
}

function closePastCard(){
  document.getElementById('past-card').classList.remove('show');
}

function init(){
  const now=new Date();
  document.getElementById('dl').textContent=`${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日（${WD[now.getDay()]}）`;
  const{lon,phase}=calcMoon(now);
  const si=Math.floor(lon/30),deg=Math.floor(lon%30),sg=SG[si];
  const moonAge=getMoonAge(now);
  const phName=getPhaseName(moonAge);
  document.getElementById('mn').textContent=sg.n;
  document.getElementById('md').textContent=`${sg.e}  ${deg+1}°`;
  document.getElementById('mpn').textContent=phName;
  document.getElementById('mt').textContent=sg.d;
  drawMoon(phase);
  if(DANGER.includes(phName)){
    document.getElementById('danger-area').innerHTML=`<div class="danger-badge">⚠ ${phName}前後 — 交通・感情に注意して</div>`;
  }
  todayMoon={sign:sg.n,deg:deg+1,phase:phName};
  const rec=loadRec(),dk=today();
  renderTasks();
  renderCalendar();
}
init();
</script>
</body>
</html>
